<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pie Safe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #ecdcb0;
      color: #2a1e10;
      width: 320px;
      min-height: 120px;
    }

    .header {
      background: #6b5c8a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      font-size: 1.1rem;
      color: #fdf6e8;
      font-weight: 400;
    }

    .header-logo span { color: #c8911a; }

    .body { padding: 16px; }

    /* Loading state */
    .state-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 10px;
      color: #7a6a50;
      font-size: 0.875rem;
      font-style: italic;
    }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid #d8c9a8;
      border-top-color: #c8911a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Not logged in */
    .state-login {
      padding: 20px 16px;
      text-align: center;
    }

    .state-login p { font-size: 0.875rem; color: #7a6a50; margin-bottom: 12px; line-height: 1.5; }

    .btn-open {
      display: inline-block;
      background: #6b5c8a;
      color: #fdf6e8;
      border: none;
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      font-family: Georgia, serif;
    }

    /* Preview state */
    .recipe-title {
      font-size: 1.1rem;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .recipe-meta {
      font-size: 0.75rem;
      color: #7a6a50;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .recipe-desc {
      font-size: 0.82rem;
      color: #7a6a50;
      line-height: 1.55;
      margin-bottom: 12px;
      font-style: italic;
    }

    .recipe-badge {
      display: inline-block;
      background: #ebe6f4;
      color: #6b5c8a;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .no-recipe {
      font-size: 0.875rem;
      color: #7a6a50;
      font-style: italic;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-save {
      flex: 1;
      background: #6b5c8a;
      color: #fdf6e8;
      border: none;
      padding: 9px;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .btn-save:hover { background: #534670; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-cancel {
      background: transparent;
      color: #7a6a50;
      border: 1px solid #d8c9a8;
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .btn-cancel:hover { background: #d8c9a8; }

    /* Saved state */
    .state-saved {
      padding: 20px 16px;
      text-align: center;
    }

    .saved-check {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .saved-title {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .saved-sub {
      font-size: 0.8rem;
      color: #7a6a50;
      margin-bottom: 14px;
    }

    .btn-view {
      display: inline-block;
      background: #c8911a;
      color: #fdf6e8;
      border: none;
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      font-family: Georgia, serif;
    }

    /* Error */
    .state-error {
      padding: 16px;
      font-size: 0.82rem;
      color: #a85030;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">Pie <span>Safe</span></div>
  </div>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
